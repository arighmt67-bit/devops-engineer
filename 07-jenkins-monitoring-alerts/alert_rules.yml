groups:
  - name: jenkins-availability
    rules:
      - alert: JenkinsDown
        expr: up{job="jenkins"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Jenkins tidak dapat di-scrape"
          description: "Target {{ $labels.instance }} tidak merespons selama lebih dari 30 detik."

      - alert: JenkinsQueueHigh
        expr: jenkins_queue_size_value > 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Antrean build Jenkins menumpuk"
          description: "Ada {{ $value }} job menunggu di antrean selama lebih dari 1 menit."
