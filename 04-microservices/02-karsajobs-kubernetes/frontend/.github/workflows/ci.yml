# =============================================================================
# CI pipeline untuk branch karsajobs-ui (frontend Vue.js)
# Menerapkan Saran ke-4: Continuous Integration via GitHub Actions.
# Langkah wajib sesuai kriteria: lint-dockerfile -> build-app-karsajobs-ui
# Image di-push ke GitHub Container Registry (GHCR) memakai GITHUB_TOKEN bawaan.
# =============================================================================
name: CI Karsa Jobs Frontend

# Jalankan pipeline saat ada push atau pull request ke branch karsajobs-ui
on:
  push:
    branches: [ karsajobs-ui ]
  pull_request:
    branches: [ karsajobs-ui ]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: lint-dockerfile -> instal hadolint lalu jalankan ke Dockerfile
  # ---------------------------------------------------------------------------
  lint-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4
      - name: Instal hadolint
        run: |
          # Unduh binary hadolint dan jadikan executable
          sudo wget -O /bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo chmod +x /bin/hadolint
      - name: Jalankan hadolint pada Dockerfile
        run: hadolint Dockerfile

  # ---------------------------------------------------------------------------
  # Job 2: build-app-karsajobs-ui -> build image frontend dan push ke GHCR
  # ---------------------------------------------------------------------------
  build-app-karsajobs-ui:
    runs-on: ubuntu-latest
    needs: lint-dockerfile        # berjalan setelah lint sukses
    permissions:
      contents: read
      packages: write             # izin push image ke GHCR
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4
      - name: Login ke GHCR
        # Login memakai GITHUB_TOKEN otomatis (tidak perlu PAT manual)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build dan push image frontend
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/karsajobs-ui:latest
          docker build -t $IMAGE .
          docker push $IMAGE
