apiVersion: v1
kind: ConfigMap
metadata:
  name: forum-api-config
  labels:
    app: forum-api
data:
  NODE_ENV: "production"
  PORT: "5000"
  HOST: "0.0.0.0"
  PGHOST: "postgres-service"
  PGPORT: "5432"
  PGDATABASE: "forumapi"
---
apiVersion: v1
kind: Secret
metadata:
  name: forum-api-secret
  labels:
    app: forum-api
type: Opaque
stringData:
  PGUSER: "forum_user"
  PGPASSWORD: "forum_password"
  ACCESS_TOKEN_KEY: "super_secret_jwt_access_token_key"
  REFRESH_TOKEN_KEY: "super_secret_jwt_refresh_token_key"
  ACCESS_TOKEN_AGE: "1800"
